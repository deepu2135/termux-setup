### Termux Properties Configuration ###
# Configured by Termux Setup (deepu2135)

# ── Extra Keys Row ──────────────────────────────────────────
# 2-Row Extra Keys with Swipe-Up Popups for maximum efficiency
extra-keys = [ \
  [ \
    {key: 'ESC', popup: '`'}, \
    {key: 'TAB', popup: '\\'}, \
    {key: 'CTRL', popup: '^'}, \
    {key: 'ALT', popup: '~'}, \
    {key: '-', popup: '_'}, \
    {key: 'UP', popup: 'PGUP'}, \
    {key: 'DOWN', popup: 'PGDN'} \
  ], \
  [ \
    {key: '(', popup: '['}, \
    {key: ')', popup: ']'}, \
    {key: '"', popup: '\''}, \
    {key: '/', popup: '?'}, \
    {key: '|', popup: '&'}, \
    {key: 'LEFT', popup: 'HOME'}, \
    {key: 'RIGHT', popup: 'END'} \
  ] \
]

# ── Terminal Behavior ──────────────────────────────────────
# Bell action: ignore or vibrate
bell-character = ignore
bell-vibrate = false

# Back key behavior: back sends ESC or exits fullscreen
back-key = back

# Fullscreen mode (true / false)
use-fullscreen = false

# Fix Ctrl+Space on Android keyboards
ctrl-space-workaround = true

# Default working directory (uncomment to customize)
# default-working-directory = /data/data/com.termux/files/home
