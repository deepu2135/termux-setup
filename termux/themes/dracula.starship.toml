command_timeout = 2000
add_newline = true

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$package\
$python\
$nodejs\
$rust\
$golang\
$java\
$docker_context\
$cmd_duration\
$jobs\
$battery\
$line_break\
$status\
$character"""

[character]
success_symbol = "[❯](bold #bd93f9)"
error_symbol = "[❯](bold #ff5555)"
vicmd_symbol = "[❮](bold #f1fa8c)"

[username]
style_user = "bold #8be9fd"
style_root = "bold #ff5555"
format = "[$user]($style) "
show_always = false

[hostname]
ssh_only = true
style = "bold #bd93f9"
format = "at [$hostname]($style) "

[directory]
style = "bold #8be9fd"
format = "in [$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " 🔒"
read_only_style = "bold #ff5555"
home_symbol = "~"

[git_branch]
symbol = " "
style = "bold #ff79c6"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold #ff5555"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 2_000
style = "bold #f1fa8c"
format = "took [$duration](bold #f1fa8c) "

[package]
symbol = "pkg "
style = "bold #bd93f9"
format = "[$symbol$version]($style) "

[python]
symbol = "🐍 "
style = "bold #50fa7b"
format = '[$symbol$version]($style) '
detect_extensions = ['py']
detect_files = ['requirements.txt', 'pyproject.toml', 'Pipfile']

[nodejs]
symbol = "⬢ "
style = "bold #50fa7b"
format = '[$symbol$version]($style) '

[rust]
symbol = "🦀 "
style = "bold #ff5555"
format = '[$symbol$version]($style) '

[golang]
symbol = "🐹 "
style = "bold #8be9fd"
format = '[$symbol$version]($style) '

[java]
symbol = "☕ "
style = "bold #f1fa8c"
format = '[$symbol$version]($style) '

[status]
disabled = false
style = "bold #ff5555"
symbol = "✗ "
success_symbol = ""
format = "[$symbol$status]($style) "
