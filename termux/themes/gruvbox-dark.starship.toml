command_timeout = 2000
add_newline = true

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$package\
$python\
$nodejs\
$rust\
$golang\
$java\
$docker_context\
$cmd_duration\
$jobs\
$battery\
$line_break\
$status\
$character"""

[character]
success_symbol = "[❯](bold #fe8019)"
error_symbol = "[❯](bold #fb4934)"
vicmd_symbol = "[❮](bold #fabd2f)"

[username]
style_user = "bold #fabd2f"
style_root = "bold #fb4934"
format = "[$user]($style) "
show_always = false

[directory]
style = "bold #fabd2f"
format = "in [$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " 🔒"
read_only_style = "bold #fb4934"
home_symbol = "~"

[git_branch]
symbol = " "
style = "bold #fe8019"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold #fb4934"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 2_000
style = "bold #fabd2f"
format = "took [$duration](bold #fabd2f) "

[python]
symbol = "🐍 "
style = "bold #b8bb26"
format = '[$symbol$version]($style) '

[nodejs]
symbol = "⬢ "
style = "bold #b8bb26"
format = '[$symbol$version]($style) '

[rust]
symbol = "🦀 "
style = "bold #fb4934"
format = '[$symbol$version]($style) '

[golang]
symbol = "🐹 "
style = "bold #83a598"
format = '[$symbol$version]($style) '

[java]
symbol = "☕ "
style = "bold #83a598"
format = '[$symbol$version]($style) '

[status]
disabled = false
style = "bold #fb4934"
symbol = "✗ "
success_symbol = ""
format = "[$symbol$status]($style) "
