# ============================================================
#  Mobile-Optimized Tmux Configuration with Top Tab Bar
# ============================================================

# ── 1. Top Status Bar & Touch Support ────────────────────────
set -g status-position top
set -g mouse on
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ── 2. Tab Numbering & Responsive Renumbering ────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# ── 3. Smooth Responsiveness ─────────────────────────────────
set -s escape-time 0
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 3

# ── 4. Catppuccin Mocha Top Tab Bar Styling ──────────────────
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 60

# Left side: OS Icon & Session Name
set -g status-left "#[bg=#cba6f7,fg=#11111b,bold]  #S #[bg=default,fg=default] "

# Right side: Time
set -g status-right "#[fg=#a6adc8,bg=#1e1e2e] %I:%M %p #[default]"

# Tab formatting (Inactive tabs)
setw -g window-status-format "#[bg=#313244,fg=#a6adc8]  #I: #W  #[default]"

# Tab formatting (Active selected tab)
setw -g window-status-current-format "#[bg=#89b4fa,fg=#11111b,bold] 󰄾 #I: #W #[default]"

setw -g window-status-separator " "

# ── 5. Convenient Keybindings ────────────────────────────────
# Prefix: Both Ctrl-b and Ctrl-a
set -g prefix C-b
bind C-a send-prefix

# Create new tab in same directory
bind c new-window -c "#{pane_current_path}"
bind t new-window -c "#{pane_current_path}"

# Easy splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Quick tab switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-Right next-window
bind -n M-Left previous-window
